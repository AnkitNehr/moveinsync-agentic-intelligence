server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/plain
  error:
    include-message: always

spring:
  application:
    name: mobility-intelligence
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    async:
      request-timeout: 600000

app:
  data:
    # Directory holding the raw CSV extracts. Filenames contain spaces
    # (e.g. "Ride_data _trip-may_2026.csv") so globbing is done with Ride_data*.csv.
    raw-path: ./data/raw

  sla:
    # On-time arrival target: 95% of campus trips must land within the grace window.
    ota: 0.95
    # Escort compliance is a zero-tolerance control.
    escort-compliance: 1.0
    # Alerts must be acknowledged within 15 minutes of being raised.
    alert-ack-minutes: 15
    # Only meaningful for distance-based contracts; fixed-rate contracts report 0 km.
    #
    # Derived from the data, NOT guessed. A target of 25.0 put every business unit
    # permanently in CRITICAL breach and flagged a cost *decrease* as an incident.
    # See tools/analysis/sla_baseline.py for the query behind this number.
    #
    # CALIBRATION HISTORY — kept because the ordering mistake is instructive.
    # 85.0 was first derived from the PRE-credit-note series (75.37 / 80.05 / 78.37).
    # Excluding negative trip_cost afterwards moved the series to 86.60 / 80.24 / 78.51,
    # so the ceiling was set against numbers that no longer existed. Deriving a
    # threshold before finishing the metric definition is the mistake; the lesson is
    # that an SLA constant must be re-derived whenever its metric's formula changes.
    #
    # VERIFIED BEHAVIOUR against the post-filter series:
    #   2026-05  86.60  breaches   <- the expensive month, correctly flagged
    #   2026-06  80.24  clears
    #   2026-07  78.51  clears
    # The threshold happens to sit between the worst month and the improving ones,
    # which is where a ceiling belongs, so it is left at 85.0 deliberately rather
    # than by inertia. Retuning it is a business decision, not a mechanical fix.
    cost-per-km-distance-contracts: 85.0
    # Mean billed cost per trip is 1331 (May) / 1340 (Jun) / 1356 (Jul);
    # median 1275, p90 1860. 1400 is a ceiling with headroom above the trend.
    cost-per-trip: 1400.0

  industry:
    # External benchmarks used for peer framing in metric observations.
    ota: 0.93
    noshow: 0.06

  scanner:
    # Volume gate. Segments below this trip count are suppressed to stop tiny
    # slices (SPOT_2.0 = 702 trips, trip_nodal='SHUTTLE' = 244 trips) producing
    # bogus double-digit swings.
    min-sample: 500
    # Maximum ranked findings carried forward from the scan into attribution.
    top-n: 20
    # Delay minutes at or below this value still count as on-time.
    grace-minutes: 5

  llm:
    # The provider is chosen by which credential is present, not by config. Set
    # ANTHROPIC_API_KEY, GEMINI_API_KEY, SARVAM_API_KEY or NVIDIA_API_KEY;
    # ModelClientRouter picks whichever can actually serve, and falls through to
    # the deterministic path if none can. Set enabled: false to force that path.
    enabled: true
    triage-model: claude-sonnet-5
    reasoning-model: claude-opus-5
    narrative-model: claude-opus-5
    chat-model: claude-haiku-4-5

    gemini:
      # Google renames and retires these faster than a compiled default can track, which is
      # why they live here rather than in GeminiClient. Proven by the first live call: the
      # original gemini-2.0-flash default returned
      #   404 "This model is no longer available. Please update your code to use
      #        models/gemini-3.6-flash"
      # A config edit fixed it; no Java changed. That is the whole argument for keeping
      # provider details out of code.
      # The free tier meters GenerateRequestsPerDayPerProjectPerModel — 20 requests per day, and
      # crucially per MODEL, not per project. One pipeline pass spends 11-25 calls, so a single
      # model id is roughly one run per day before HTTP 429.
      #
      # gemini-3.6-flash was exhausted during a day of testing. Moving to 2.5-flash draws on a
      # separate pool and costs nothing else: same endpoint, same wire format, same adapter. It is
      # the cheapest possible demonstration of why the model id is configuration — a quota wall on
      # the morning of a demo is fixed by editing this line, not by touching Java.
      #
      # If this one is also exhausted, any id from GET /v1beta/models with generateContent support
      # will serve; pools are independent.
      # Three ids, not one. The quota is metered per model, so pointing all three tiers at the same
      # id puts all 11-25 calls of a run back into a single 20/day pool — which is what the previous
      # edit did while its own comment explained why that could not work. Spreading the tiers across
      # three pools is the whole benefit per-model metering offers, and it happens to be what the
      # tier split is for anyway: triage is a cheap batched call, narrative is the one worth spending
      # the better model on.
      cheap-model: gemini-2.5-flash-lite
      mid-model: gemini-2.5-flash
      strong-model: gemini-flash-latest

    sarvam:
      # OpenAI-compatible Chat Completions at https://api.sarvam.ai/v1/chat/completions.
      # A 404 from a renamed model id is fixed here rather than in SarvamClient.
      # Thinking is disabled in SarvamClient (reasoning_effort: null).
      cheap-model: sarvam-105b
      mid-model: sarvam-105b
      strong-model: sarvam-105b

    nim:
      # Hosted NVIDIA NIM at https://integrate.api.nvidia.com/v1/chat/completions.
      # Catalog ids (e.g. google/gemma-4-31b-it) are swapped here, not in NimClient.
      # Thinking is off: this app wants JSON/markdown, not chain-of-thought.
      enable-thinking: false
      cheap-model: google/gemma-4-31b-it
      mid-model: google/gemma-4-31b-it
      strong-model: google/gemma-4-31b-it

  cors:
    allowed-origins:
      - http://localhost:4200
      - http://127.0.0.1:4200

logging:
  level:
    root: INFO
    com.moveinsync.mi: INFO
