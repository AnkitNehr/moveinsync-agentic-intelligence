server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/plain
  error:
    include-message: always

spring:
  application:
    name: mobility-intelligence
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    async:
      request-timeout: 600000

app:
  data:
    # Directory holding the raw CSV extracts. Filenames contain spaces
    # (e.g. "Ride_data _trip-may_2026.csv") so globbing is done with Ride_data*.csv.
    raw-path: ./data/raw

  sla:
    # On-time arrival target: 95% of campus trips must land within the grace window.
    ota: 0.95
    # Escort compliance is a zero-tolerance control.
    escort-compliance: 1.0
    # Alerts must be acknowledged within 15 minutes of being raised.
    alert-ack-minutes: 15
    # Only meaningful for distance-based contracts; fixed-rate contracts report 0 km.
    #
    # Derived from the data, NOT guessed. A target of 25.0 put every business unit
    # permanently in CRITICAL breach and flagged a cost *decrease* as an incident.
    # See tools/analysis/sla_baseline.py for the query behind this number.
    #
    # CALIBRATION HISTORY — kept because the ordering mistake is instructive.
    # 85.0 was first derived from the PRE-credit-note series (75.37 / 80.05 / 78.37).
    # Excluding negative trip_cost afterwards moved the series to 86.60 / 80.24 / 78.51,
    # so the ceiling was set against numbers that no longer existed. Deriving a
    # threshold before finishing the metric definition is the mistake; the lesson is
    # that an SLA constant must be re-derived whenever its metric's formula changes.
    #
    # VERIFIED BEHAVIOUR against the post-filter series:
    #   2026-05  86.60  breaches   <- the expensive month, correctly flagged
    #   2026-06  80.24  clears
    #   2026-07  78.51  clears
    # The threshold happens to sit between the worst month and the improving ones,
    # which is where a ceiling belongs, so it is left at 85.0 deliberately rather
    # than by inertia. Retuning it is a business decision, not a mechanical fix.
    cost-per-km-distance-contracts: 85.0
    # Mean billed cost per trip is 1331 (May) / 1340 (Jun) / 1356 (Jul);
    # median 1275, p90 1860. 1400 is a ceiling with headroom above the trend.
    cost-per-trip: 1400.0

  industry:
    # External benchmarks used for peer framing in metric observations.
    ota: 0.93
    noshow: 0.06

  scanner:
    # Volume gate. Segments below this trip count are suppressed to stop tiny
    # slices (SPOT_2.0 = 702 trips, trip_nodal='SHUTTLE' = 244 trips) producing
    # bogus double-digit swings.
    min-sample: 500
    # Maximum ranked findings carried forward from the scan into attribution.
    top-n: 20
    # Delay minutes at or below this value still count as on-time.
    grace-minutes: 5

  llm:
    # The provider is chosen by which credential is present, not by config. Set
    # ANTHROPIC_API_KEY or GEMINI_API_KEY in the environment; ModelClientRouter picks
    # whichever can actually serve, and falls through to the deterministic path if
    # neither can. Set enabled: false to force the deterministic path deliberately.
    enabled: true
    triage-model: claude-sonnet-5
    reasoning-model: claude-opus-5
    narrative-model: claude-opus-5
    chat-model: claude-haiku-4-5

    gemini:
      # Google renames and retires these faster than a compiled default can track, so a
      # 404 from the API is fixed here rather than in GeminiClient. Free-tier keys from
      # aistudio.google.com reach the flash models; the pro models may require billing.
      cheap-model: gemini-2.0-flash
      mid-model: gemini-2.0-flash
      strong-model: gemini-2.5-flash

  cors:
    allowed-origins:
      - http://localhost:4200

logging:
  level:
    root: INFO
    com.moveinsync.mi: INFO
